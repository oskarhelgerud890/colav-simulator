experiment_name: sweep_crossing_distance
template: experiments/templates/base_two_ship.yaml
out_dir: experiments/runs

show_plots: false
liveplot: true
new_load_of_map_data_first_case: true

run_evaluator: true
evaluator:
  map_data_files: ["More_og_Romsdal_utm33.gdb"]
  utm_zone: 33
  new_map_data_load: false

# Krysningspunkt i ENU (N,E)
crossing_point_enu: [6946500.0, 42000.0]

# Ship0: start sør for krysningspunkt og gå nordover
ship0_start_south_m: 1200.0
ship0_wp_length_m: 3000.0

# Ship1: kommer fra høyre (øst) og går vestover
ship1_heading_deg: 270.0
ship1_wp_length_m: 3000.0

# Sweep: start-avstand øst for krysningspunktet (meter)
sweep:
  ship1_start_east_m:
    start: 1200.0
    stop: 1200.0
    step: 1.0

visual_debug:
  enabled: false
  case_id: "0001"
