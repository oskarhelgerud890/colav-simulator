name: "my_minimal_cr"
save_scenario: False
t_start: 0.0
t_end: 240.0
dt_sim: 0.5
utm_zone: 33

map_data_files: ["More_og_Romsdal_utm33.gdb"]
new_load_of_map_data: True
map_size: [7000.0, 5000.0]
map_origin_enu: [35000.0, 6956450.0]
map_tolerance: 1
map_buffer: 50

type: CR_GW
n_episodes: 1
n_random_ships: 1

ship_list:
  # Own-ship (id=0)
  - id: 0
    mmsi: 100
    csog_state: [6958000.0, 40500.0, 6.0, 0.0]
    waypoints:  [[6958000.0, 6960000.0], [40500.0, 40500.0]]
    speed_plan: [6.0, 6.0]

    # Anchor-definisjoner LEGGES HER (ikke på toppnivå)
    guidance: &common_guidance
      los:
        pass_angle_threshold: 80.0
        R_a: 15.0
        K_p: 0.024
        K_i: 0.0
        max_cross_track_error_int: 101.0
        cross_track_error_int_threshold: 30.0

    controller: &common_controller
      flsc:
        K_p_u: 3.0
        K_i_u: 0.3
        K_p_chi: 2.5
        K_d_chi: 3.0
        K_i_chi: 0.1
        max_speed_error_int: 4.0
        speed_error_int_threshold: 0.5
        max_chi_error_int: 90.0
        chi_error_int_threshold: 20.0

    tracker: &common_tracker
      kf:
        P_0: [49.1, 49.1, 0.11, 0.11]
        q: 0.1

    sensors: &common_sensors
      - radar:
          max_range: 2000.0
          measurement_rate: 1.0
          R_ne: [30.0, 30.0]
          R_ne_true: [25.0, 25.0]
          R_polar_true: [64.0, 0.0003]
          generate_clutter: False
          clutter_cardinality_expectation: 5
          detection_probability: 0.95
          include_polar_meas_noise: False

    model: { viknes: "" }

  # Target ship (id=1)
  - id: 1
    mmsi: 101
    csog_state: [6958150.0, 40700.0, 6.0, 270.0]
    waypoints:  [[6958150.0, 6958150.0], [40700.0, 39500.0]]
    speed_plan: [6.0, 6.0]

    # Reuse samme guidance/controller/tracker/sensors som Ship0
    guidance: *common_guidance
    controller: *common_controller
    tracker:
      kf:
        P_0: [49.1, 49.1, 0.11, 0.11]
        q: 0.15

    sensors:
      - radar:
          max_range: 1000.0
          measurement_rate: 1.0
          R_ne: [25.0, 25.0]
          R_ne_true: [25.0, 25.0]
          R_polar_true: [64.0, 0.0003]
          generate_clutter: True
          clutter_cardinality_expectation: 5
          detection_probability: 0.95
          include_polar_meas_noise: False
      - ais:
          max_range: 5000.0
          ais_class: A
          R: [26.3, 26.3, 0.1, 0.1]
          R_true: [26.3, 26.3, 0.1, 0.1]

    model: { viknes: "" }
